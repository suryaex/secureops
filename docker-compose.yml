# SecureOps Controller — lightweight Docker stack (mirrors StorageHub's layout)
#   cp .env.example .env && docker compose up -d --build
#   (or simply:  ./install.sh   /   make install)
#
# Three small images (no DB container — the controller uses SQLite on a volume):
#   • backend  — FastAPI + gunicorn (internal :8000), SQLite on a named volume
#   • frontend — nginx serving the built React SPA (internal :80)
#   • nginx    — edge reverse proxy → /api (+ WebSocket terminal) to backend, / to frontend
#
# NOTE: Linux PAM login needs host accounts, which a container does not see —
# in Docker, sign in with the DB admin (SECUREOPS_ADMIN_PASSWORD / email login).
services:
  backend:
    image: ghcr.io/suryaex/secureops-backend:latest
    build:
      context: ./controller/backend
    container_name: secureops-backend
    restart: unless-stopped
    environment:
      SECUREOPS_BEHIND_PROXY: "1"
      SECUREOPS_JWT_SECRET: ${SECUREOPS_JWT_SECRET:-}
      SECUREOPS_ADMIN_PASSWORD: ${SECUREOPS_ADMIN_PASSWORD:-}
      SECUREOPS_CORS_ORIGINS: ${SECUREOPS_CORS_ORIGINS:-*}
      SECUREOPS_ENABLE_HSTS: ${SECUREOPS_ENABLE_HSTS:-0}
      # LogSync → StorageHub (optional)
      SECUREOPS_STORAGEHUB_URL: ${SECUREOPS_STORAGEHUB_URL:-}
      SECUREOPS_STORAGEHUB_API_KEY: ${SECUREOPS_STORAGEHUB_API_KEY:-}
      SECUREOPS_LOGSYNC_INTERVAL_MIN: ${SECUREOPS_LOGSYNC_INTERVAL_MIN:-15}
    volumes:
      - secureops_data:/app/data
    expose:
      - "8000"
    networks:
      - secureops

  frontend:
    image: ghcr.io/suryaex/secureops-web:latest
    build:
      context: ./controller/frontend
    container_name: secureops-web
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost) — nginx listens IPv4 only here
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secureops

  nginx:
    image: nginx:alpine
    container_name: secureops-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      # SecureOps owns :80 by default (StorageHub uses :8080). Override via SECUREOPS_HTTP_PORT.
      - "${SECUREOPS_HTTP_PORT:-80}:80"
    volumes:
      - ./controller/deploy/nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - secureops

volumes:
  secureops_data:

networks:
  secureops:
    driver: bridge
