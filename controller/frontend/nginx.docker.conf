# SecureOps Controller reverse proxy (Docker).
# Serves the SPA and proxies /api (incl. WebSocket terminal) to the backend
# container. Uses Docker's embedded DNS with a variable upstream so nginx
# re-resolves the backend IP if its container restarts (avoids stuck 502s).
map $http_upgrade $http_connection { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }
    location = /sw.js                { add_header Cache-Control "no-cache"; expires 0; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; expires 0; }
    location = /index.html           { add_header Cache-Control "no-cache"; expires 0; }

    location /api/ {
        set $be backend;
        proxy_pass http://$be:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_connect_timeout 30s;
        proxy_send_timeout 7d;       # long-lived terminal sessions
        proxy_read_timeout 7d;
        proxy_buffering off;
    }
    location ~ ^/(docs|redoc|openapi.json)$ {
        set $be2 backend;
        proxy_pass http://$be2:8000$request_uri;
        proxy_set_header Host $host;
    }

    location / { try_files $uri $uri/ /index.html; }
}
