# SecureOps frontend — serves the built React SPA only (the edge `nginx`
# service does the /api reverse-proxy). Mirrors StorageHub's frontend image.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the service worker / manifest / index
    location = /sw.js                { add_header Cache-Control "no-cache"; expires 0; }
    location = /registerSW.js        { add_header Cache-Control "no-cache"; expires 0; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; expires 0; }
    location = /index.html           { add_header Cache-Control "no-cache"; expires 0; }

    # Long-cache hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
    gzip_min_length 1024;
}
