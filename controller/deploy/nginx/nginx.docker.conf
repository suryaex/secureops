# SecureOps edge reverse proxy (Docker) — mirrors StorageHub's deployment/nginx.
# Uses Docker's embedded DNS with variable upstreams so nginx re-resolves the
# backend/frontend container IPs at runtime (avoids stuck 502s after a restart).
map $http_upgrade $http_connection { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ── Backend API (incl. WebSocket terminal) ──
    location /api/ {
        set $be backend;
        proxy_pass http://$be:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_connect_timeout 30s;
        proxy_send_timeout 7d;       # long-lived terminal sessions
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    # OpenAPI docs
    location ~ ^/(docs|redoc|openapi.json)$ {
        set $be2 backend;
        proxy_pass http://$be2:8000$request_uri;
        proxy_set_header Host $host;
    }

    # ── Frontend SPA ──
    location / {
        set $fe frontend;
        proxy_pass http://$fe:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Security headers ──
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
}
